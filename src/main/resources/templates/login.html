<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kutubxona - Tizimga kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.pexels.com/photos/159711/books-bookstore-book-reading-159711.jpeg?auto=compress&cs=tinysrgb&w=1920');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="hero-bg h-screen flex justify-center items-center text-white m-0">

    <div class="bg-gray-900/90 border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-sm relative">
        
        <h2 class="text-3xl font-extrabold text-center mb-2 text-amber-400">Tizimga kirish</h2>
        <p class="text-center text-gray-400 text-sm mb-6">Ma'lumotlarni tasdiqlab asosiy ekranga o'ting</p>

        <!-- Xatolik xabarini chiqarish (agar login yoki parol xato bo'lsa) -->
        <div th:if="${error}" class="mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg text-center" th:text="${error}">
        </div>

        <!-- KIRISH FORMASI -->
        <form th:action="@{/login}" method="POST">
            
            <div class="space-y-4">
                <!-- LOGIN -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" placeholder="Loginni kiriting" required 
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-400">
                </div>

                <!-- PAROL -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Parol</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-400">
                </div>

                <!-- TUGMA -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 rounded-lg transition mt-2">
                    Kirish
                </button>
            </div>

        </form>

        <div class="text-center mt-6 text-sm text-gray-400">
            Hisobingiz yo'qmi? <a href="/register" class="text-amber-400 hover:underline font-medium">Ro'yxatdan o'tish</a>
        </div>

    </div>

</body>
</html>
