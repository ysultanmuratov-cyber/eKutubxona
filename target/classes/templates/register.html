<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kutubxona - Ro'yxatdan o'tish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hero-bg {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://images.pexels.com/photos/159711/books-bookstore-book-reading-159711.jpeg?auto=compress&cs=tinysrgb&w=1920');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="hero-bg h-screen flex justify-center items-center text-white m-0">

    <div class="bg-gray-900/90 border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md backdrop-blur-sm relative">
        
        <h2 class="text-3xl font-extrabold text-center mb-6 text-amber-400">Ro'yxatdan o'tish</h2>

        <!-- Xatolik xabarini chiqarish (agar login band bo'lsa) -->
        <div th:if="${error}" class="mb-4 p-3 bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg text-center" th:text="${error}">
        </div>

        <!-- SPRING BOOT ga ma'lumot yuboruvchi asosiy FORM -->
        <form th:action="@{/register}" method="POST" onsubmit="return validateAndSubmit(event)">
            
            <div class="space-y-4">
                <!-- LOGIN -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Login</label>
                    <input type="text" id="username" name="username" placeholder="Loginni kiriting" required 
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-400">
                </div>

                <!-- PAROL -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Parol</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-400">
                    <p class="text-xs text-gray-400 mt-1">Kamida 8 ta belgi, 1 ta katta harf va 1 ta raqam bo'lishi shart.</p>
                </div>

                <!-- PAROLNI TASDIQLASH -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Parolni tasdiqlang</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required
                           class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-amber-400">
                </div>

                <!-- JAVASCRIPT XATOLIKLARI UCHUN -->
                <div id="error-msg" class="text-red-400 text-xs hidden"></div>

                <!-- TUGMA -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 rounded-lg transition">
                    Ro'yxatdan o'tish
                </button>
            </div>

        </form>

        <div class="text-center mt-6 text-sm text-gray-400">
            Hisobingiz bormi? <a href="/login" class="text-amber-400 hover:underline font-medium">Kirish</a>
        </div>

    </div>

    <script>
        function validateAndSubmit(event) {
            const username = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error-msg');

            if (username.length < 5) {
                event.preventDefault();
                errorDiv.innerText = "Login kamida 3 ta belgidan iborat bo'lishi kerak!";
                errorDiv.classList.remove('hidden');
                return false;
            }

            // Parol talablari: kamida 8 ta belgi, 1 ta katta harf va 1 ta raqam
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

            if (!passwordRegex.test(pass)) {
                event.preventDefault(); 
                errorDiv.innerText = "Parol kamida 8 ta belgidan iborat bo'lib, tarkibida kamida 1 ta katta harf va 1 ta raqam bo'lishi kerak!";
                errorDiv.classList.remove('hidden');
                return false;
            }

            if (pass !== confirmPass) {
                event.preventDefault(); 
                errorDiv.innerText = "Parollar bir-biriga mos kelmadi!";
                errorDiv.classList.remove('hidden');
                return false;
            }

            errorDiv.classList.add('hidden');
            return true; // Hammasi to'g'ri bo'lsa Back-end ga ma'lumot ketadi
        }
    </script>
</body>
</html>
