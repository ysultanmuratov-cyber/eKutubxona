<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kutubxona - Tizimga kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

    <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">Tizimga kirish</h1>
            <p class="text-gray-400 text-sm mt-1">Kitoblarni o'qish uchun hisobingizga kiring</p>
        </div>

        <form th:action="@{/login}" method="POST" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Foydalanuvchi nomi</label>
                <input type="text" name="username" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Parol</label>
                <input type="password" name="password" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400 text-sm">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10 text-sm mt-2">
                Kirish
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-400">
            Hisobingiz yo'qmi? <a href="/register" class="text-amber-400 hover:underline font-medium">Ro'yxatdan o'tish</a>
        </div>
    </div>

</body>
</html>
